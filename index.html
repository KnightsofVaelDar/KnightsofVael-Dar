<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knights of Vael'Dar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap');
    .title-font { font-family: 'Cinzel', serif; }
    .body-font { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-stone-950 text-stone-200 body-font min-h-screen flex flex-col justify-between selection:bg-amber-900 selection:text-stone-100">

  <!-- Header / Navigation Placeholder -->
  <header class="border-b border-stone-800/80 px-6 py-5">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <span class="title-font tracking-widest text-lg font-bold text-stone-100">VAEL'DAR</span>
      <span class="text-xs uppercase tracking-widest text-stone-500 border border-stone-800 px-3 py-1 rounded">Initiation Phase</span>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="max-w-4xl mx-auto px-6 py-24 text-center my-auto">
    <div class="inline-block mb-4 px-3 py-1 text-xs tracking-widest text-amber-500/90 border border-amber-500/30 rounded-full bg-amber-950/20">
      PORTAL ACTIVE
    </div>

    <h1 class="title-font text-4xl sm:text-6xl font-bold tracking-wider text-stone-100 mb-6">
      KNIGHTS OF VAEL'DAR
    </h1>

    <p class="text-lg sm:text-xl text-stone-400 font-light max-w-2xl mx-auto leading-relaxed mb-10">
      Bonded by struggle and the war within. The foundation is set.
    </p>

    <div class="h-px w-24 bg-stone-800 mx-auto mb-10"></div>

    <p class="text-xs tracking-widest text-stone-500 uppercase">
      knightsofvaeldar.com &bull; Hosted via GitHub Pages
    </p>
  </main>

  <!-- Footer -->
  <footer class="border-t border-stone-800/80 px-6 py-6 text-center text-xs tracking-wider text-stone-600">
    &copy; 2026 Knights of Vael'Dar. All rights reserved.
  </footer>

</body>
</html>
